services:
  - type: web
    name: collabspace-backend
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./apps/backend
    dockerfilePath: ./apps/backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collabspace-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collabspace-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # JSON list, e.g. ["https://<app>.vercel.app"]
      - key: GEMINI_API_KEY
        sync: false

  - type: keyvalue
    name: collabspace-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: collabspace-postgres
    region: oregon
    plan: free
    databaseName: collabspacedb
    user: collabspace
