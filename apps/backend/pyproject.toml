[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collabspace-backend"
version = "0.1.0"
description = "CollabSpace — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # ─── Web framework ────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ─── Real-time ────────────────────────────────────────────────
    "python-socketio>=5.11.0",

    # ─── Database ─────────────────────────────────────────────────
    "prisma>=0.13.0",
    "asyncpg>=0.29.0",

    # ─── Redis ────────────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",

    # ─── Auth ─────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.3.0",
    "httpx>=0.27.0",           # for OAuth HTTP calls

    # ─── Config ───────────────────────────────────────────────────
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",

    # ─── AI ───────────────────────────────────────────────────────
    "google-generativeai>=0.7.0",

    # ─── Utilities ────────────────────────────────────────────────
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]

